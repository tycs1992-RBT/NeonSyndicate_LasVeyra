<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Syndicate: Las Veyra</title>
<style>
  :root {
    color-scheme: dark;
    --hud: #f4f1ea;
    --hud-dim: rgba(244, 241, 234, 0.72);
    --accent: #ffcf4a;
    --cash: #8ef08a;
    --danger: #ff4a3a;
    --panel: rgba(12, 14, 18, 0.62);
    --font: "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    --display: "Arial Black", "Helvetica Neue", Arial, sans-serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; color: var(--hud); font-family: var(--font); }
  #game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; cursor: crosshair; }
  #ui { position: fixed; inset: 0; pointer-events: none; user-select: none; }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(ellipse at 50% 30%, #2a2018 0%, #0b0d10 70%); z-index: 50; pointer-events: auto;
  }
  #loading h1 { margin: 0; font-family: var(--display); font-size: clamp(28px, 6vw, 64px); letter-spacing: 0.06em; color: #fff; text-shadow: 0 4px 30px rgba(255, 140, 60, 0.45); }
  #loading h1 span { color: var(--accent); }
  #loading .bar { width: min(420px, 80vw); height: 4px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #ff8a3c, #ffcf4a); transition: width 0.2s; }
  #loading .label { font-size: 14px; color: var(--hud-dim); letter-spacing: 0.04em; min-height: 18px; }
  #loading .err { color: #ff8a7a; max-width: 80vw; white-space: pre-wrap; font-size: 13px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="loading">
  <h1>NEON <span>SYNDICATE</span></h1>
  <div class="label" id="loadLabel">Starting up</div>
  <div class="bar"><i id="loadBar"></i></div>
  <div class="err" id="loadErr"></div>
</div>
<script>
  window.addEventListener('error', function (e) {
    var el = document.getElementById('loadErr');
    if (el) el.textContent = 'Something went wrong: ' + (e.message || e.error);
  });
</script>
<!--GAME_SCRIPT-->
</body>
</html>
