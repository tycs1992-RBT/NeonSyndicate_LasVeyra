name: Shardwake Vale scene and route
on:
  push:
    branches: [pilot/shardwake-vale]
permissions:
  contents: read
jobs:
  scene-route:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect the editable scene and its physical route
        run: |
          python -m pip install numpy PyYAML Pillow
          python tools/shardwake/check_scene.py
