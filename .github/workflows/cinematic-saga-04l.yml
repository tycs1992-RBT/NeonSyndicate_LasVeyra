name: 04L The Veil Remembers source validation

on:
  push:
    branches: [feature/the-veil-remembers-04l]
  pull_request:
    branches: [feature/renaissance-in-motion-04k]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinematic-04l-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Source, catalogs, route and preservation
        run: |
          mkdir -p "$RUNNER_TEMP/cinematic04l"
          python3 tools/check_cinematic_04l.py --report "$RUNNER_TEMP/cinematic04l/preservation.json"
          python3 tools/check_shard_war_04j.py --report "$RUNNER_TEMP/cinematic04l/inherited-04j.json"
          python3 tools/check_crystal_restoration_04i.py --report "$RUNNER_TEMP/cinematic04l/inherited-04i.json"
      - name: Twelve C# syntax configurations
        run: python3 tools/check_visual_rebirth_04a_syntax.py --dotnet "$(readlink -f "$(command -v dotnet)")" --report "$RUNNER_TEMP/cinematic04l/syntax.json"
      - name: Metadata and whitespace
        run: |
          python3 tools/check_unity_metadata_04c.py --report "$RUNNER_TEMP/cinematic04l/metadata.json"
          git diff --check df9072930596202b2a8f0fc23c9499f76faada6a HEAD
      - name: Validation scope
        if: always()
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/cinematic04l/commit.txt"
          printf '%s\n' 'This CI checks source only. Managed API/NUnit host evidence is tracked separately; native import/play/render/build remain blocked.' > "$RUNNER_TEMP/cinematic04l/scope.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic04l-source-${{ github.sha }}
          path: ${{ runner.temp }}/cinematic04l/*
